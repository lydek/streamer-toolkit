[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alerts = { version = "0.1.0", path = "../modules/alerts" }
axum = { version = "0.8.9", features = ["ws"] }
chat = { version = "0.1.0", path = "../modules/chat" }
checkin = { version = "0.1.0", path = "../modules/checkin" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
integrations = { version = "0.1.0", path = "../integrations" }
mime_guess = "2.0.5"
redemption = { version = "0.1.0", path = "../modules/redemption" }
stream = { version = "0.1.0", path = "../modules/stream" }
activity = { version = "0.1.0", path = "../modules/activity" }
viewers = { version = "0.1.0", path = "../modules/viewers" }
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
sound = { version = "0.1.0", path = "../modules/sound" }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
toolkit-core = { version = "0.1.0", path = "../core" }
tracing = "0.1.44"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v7"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10.9"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

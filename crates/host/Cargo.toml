[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alerts = { version = "0.1.0", path = "../modules/alerts" }
axum = { version = "0.8.9", features = ["ws"] }
chat = { version = "0.1.0", path = "../modules/chat" }
checkin = { version = "0.1.0", path = "../modules/checkin" }
counter = { version = "0.1.0", path = "../modules/counter" }
bot = { version = "0.1.0", path = "../modules/bot" }
songs = { version = "0.1.0", path = "../modules/songs" }
overlays = { version = "0.1.0", path = "../modules/overlays" }
integrations = { version = "0.1.0", path = "../integrations" }
mime_guess = "2.0.5"
redemption = { version = "0.1.0", path = "../modules/redemption" }
stream = { version = "0.1.0", path = "../modules/stream" }
activity = { version = "0.1.0", path = "../modules/activity" }
viewers = { version = "0.1.0", path = "../modules/viewers" }
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
sound = { version = "0.1.0", path = "../modules/sound" }
bgm = { version = "0.1.0", path = "../modules/bgm" }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3"
thiserror = "2.0.21"
base64 = "0.22.1"
color_quant = "2.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
oxipng = { version = "10.2.1", default-features = false }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toolkit-core = { version = "0.1.0", path = "../core" }
tracing = "0.1.44"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v7"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[package]
name = "host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chat = { version = "0.1.0", path = "../modules/chat" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
integrations = { version = "0.1.0", path = "../integrations" }
mime_guess = "2.0.5"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync"] }
toolkit-core = { version = "0.1.0", path = "../core" }
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

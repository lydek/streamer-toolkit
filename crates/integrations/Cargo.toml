[package]
name = "integrations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
keyring-core = "1.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
# `__rustls-tls`: EventSub uses our own rustls config (Windows store), so no bundled root set is needed.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
toolkit-core = { version = "0.1.0", path = "../core" }
tracing = "0.1.44"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "io-util"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

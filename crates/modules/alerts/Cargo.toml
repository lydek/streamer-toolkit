[package]
name = "alerts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
toolkit-core = { version = "0.1.0", path = "../../core" }
serde_json = "1.0.154"
utoipa = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "test-util"] }

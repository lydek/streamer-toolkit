# Fail the commit instead of silently skipping hooks when lefthook is not installed.
assert_lefthook_installed: true

# Full Rust and frontend checks run on pre-push (below); pre-commit stays fast.
# shortcut: checks the working tree, not the staged snapshot; CI re-runs it on the pushed commit.
pre-commit:
  parallel: true
  commands:
    translations:
      run: node scripts/check-translations.mjs

# Same steps and order as .github/workflows/ci.yml; stops at the first failure to catch red pushes before CI.
# shortcut: checks the working tree, not the pushed commits; CI re-runs on the pushed commit.
# Keep this list in sync with ci.yml. The frontend must build first: the host embeds apps/web/dist.
pre-push:
  piped: true
  jobs:
    - name: translations
      run: node scripts/check-translations.mjs
    - name: script-tests
      run: pnpm test:scripts
    - name: frontend-licenses
      run: pnpm check:licenses
    - name: web-lint
      run: pnpm web:lint
    - name: web-test
      run: pnpm web:test
    - name: web-build
      run: pnpm web:build
    - name: api-gen
      run: pnpm api:gen
    - name: api-fresh
      run: git diff --exit-code HEAD -- apps/web/src/api
    - name: cargo-fmt
      run: cargo fmt --all --check
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: clippy-release
      run: cargo clippy --workspace --all-targets --features tauri/custom-protocol -- -D warnings
    - name: cargo-test
      run: cargo test --workspace
    - name: cargo-deny
      run: cargo deny check

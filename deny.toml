# cargo-deny: license allowlist and security advisories (docs/decisions.md, "依賴授權").

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Unmaintained crates are reported only when the workspace depends on them directly.
unmaintained = "workspace"
ignore = [
    # Temporary. Bundled SQLite < 3.54 can leak memory through a crafted database plus `-wal` file pair; the exploit is
    # local only and needs write access to the data folder. The fix needs libsqlite3-sys >= 0.39, which sqlx 0.9.0
    # does not allow yet. Remove once a sqlx release does. tracking: #46
    { id = "RUSTSEC-2026-0459", reason = "local only, needs write access to the data folder; fix needs libsqlite3-sys >= 0.39, not allowed by sqlx 0.9.0 yet; tracking: #46" },
    # Temporary. chrono and chrono-tz are reported unmaintained with no replacement yet; time and time zone handling
    # depend on them. Remove once they are replaced. tracking: #89
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no replacement yet; tracking: #89" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no replacement yet; tracking: #89" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published; their own MIT license is covered by the root LICENSE.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo-deny: license allowlist and security advisories (docs/decisions.md, "依賴授權").

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Unmaintained crates are reported only when the workspace depends on them directly.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# BSL-1.0 (permissive, OSI) only for the clipboard crates iced pulls in on Windows, for the fake-services panel
# (`crates/fakes`, `ui` feature, never shipped). Not allowed anywhere else.
exceptions = [
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
]

[licenses.private]
# Workspace crates are not published; their own MIT license is covered by the root LICENSE.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

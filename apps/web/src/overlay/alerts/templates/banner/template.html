<!-- Built-in "banner": a bar that slides in along the bottom of the scene. HTML and CSS only. -->
<link rel="stylesheet" href="style.css" />
<div class="banner" data-alert-stage>
  <template data-alert>
    <div class="alert">
      <p class="title" data-field="title"></p>
      <p class="message" data-field="message"></p>
    </div>
  </template>
</div>

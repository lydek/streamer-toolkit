<!-- Built-in "text": large outlined text in the middle of the scene, no box. HTML and CSS only. -->
<link rel="stylesheet" href="style.css" />
<div class="text" data-alert-stage>
  <template data-alert>
    <div class="alert">
      <p class="title" data-field="title"></p>
      <p class="message" data-field="message"></p>
    </div>
  </template>
</div>

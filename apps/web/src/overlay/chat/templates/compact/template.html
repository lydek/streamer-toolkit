<!-- Built-in "compact": one line per message, name and text side by side. HTML and CSS only. -->
<link rel="stylesheet" href="style.css" />
<ul class="chat compact" data-chat-list>
  <template data-chat-message>
    <li class="message"><span class="name" data-field="userName"></span><span class="text" data-field="text"></span></li>
  </template>
</ul>

<!-- Built-in "bubble": each message in a rounded bubble with the name above it. HTML and CSS only. -->
<link rel="stylesheet" href="style.css" />
<ul class="chat bubble" data-chat-list>
  <template data-chat-message>
    <li class="message">
      <span class="name" data-field="userName"></span>
      <span class="text" data-field="text"></span>
    </li>
  </template>
</ul>

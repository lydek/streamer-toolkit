<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Clip Overlay</title>
    <style>
      html,
      body,
      #clip {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* The caption is a sibling below the player, never positioned over it (Twitch embed requirement 1.3). */
      #clip {
        display: flex;
        flex-direction: column;
      }
      iframe {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
      }
      /* Height matches CAPTION_HEIGHT in src/overlay/clip/clip.ts. */
      .caption {
        box-sizing: border-box;
        height: 72px;
        flex: none;
        padding: 8px 12px;
        color: #fff;
        font: 16px/1.5 sans-serif;
        background: rgba(0, 0, 0, 0.75);
      }
      .caption div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .channel {
        font-weight: 700;
      }
      p {
        margin: 0;
        padding: 8px;
        color: #fff;
        font: 16px sans-serif;
        background: rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="clip"></div>
    <script type="module" src="/src/overlay/clip/main.ts"></script>
  </body>
</html>

# Fills the build caches on main so PR runs (ci.yml) restore them instead of starting cold.
# A PR run can only restore caches saved on its own ref or on main; checks stay PR-only.
name: Warm cache

on:
  push:
    branches: [main]
  workflow_dispatch: # re-seed after GitHub updates the runner image's Rust, which changes the cache key

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same toolchain and shared-key as ci.yml, so both workflows use one cache key.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # The Host embeds apps/web/dist at compile time.
      - run: pnpm web:build

      # Build what each ci.yml cargo step compiles; no lints or tests are enforced here.
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --features tauri/custom-protocol
      # Also builds the openapi example ci.yml runs for the API contract check.
      - run: cargo test --workspace --no-run

  # ci.yml's fakes-ui job, with its own cache so iced stays out of the main one.
  warm-fakes-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fakes-ui
      - run: cargo clippy -p fakes --all-targets --features ui
      - run: cargo test -p fakes --features ui --lib --bins --no-run

# Pushing a v* tag builds the portable zip and creates a DRAFT release; a person checks it and publishes it by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  # A failing UI E2E stops the release.
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Read-only and without a stored GitHub token: everything that runs third-party build code runs here.
  build:
    needs: e2e
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, to check the tag is on main.
          fetch-depth: 0

      - name: Tag is on main
        run: git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main

      - name: Tag matches the app version
        run: node scripts/check-version.mjs "$env:TAG"

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # A build tool, not a dependency; pinned, and its own lockfile pins what it is built from.
      - name: Install cargo-about
        run: cargo install --locked cargo-about --features cli --version 0.9.3
      # Before the build: the frontend build embeds it for the settings page's about section.
      - name: Third-party licenses
        run: pnpm licenses:gen

      # tauri build turns on tauri/custom-protocol, the only distributable build; the exe is zipped below.
      - name: Build
        run: pnpm tauri build --no-bundle

      - name: Zip
        id: zip
        env:
          # Kept out of the script text so the runner's script encoding cannot mangle it.
          USAGE_NAME: 使用說明.txt
        run: |
          $version = $env:TAG.Substring(1)
          $zip = "streamer-toolkit-$version-windows-x64.zip"
          $dir = New-Item -ItemType Directory -Path "out/Streamer Toolkit"
          # Explicit file list: never the data folder.
          Copy-Item target/release/desktop.exe "$dir/Streamer Toolkit.exe"
          Copy-Item LICENSE "$dir/LICENSE"
          Copy-Item apps/web/public/THIRD_PARTY_LICENSES.txt "$dir/THIRD_PARTY_LICENSES"
          Copy-Item apps/desktop/release/usage.zh-TW.txt (Join-Path $dir $env:USAGE_NAME)
          # UTF-8 entry names (with the zip's UTF-8 flag), so the usage note keeps its Chinese name when extracted.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($dir.FullName, "$PWD/out/$zip", 'Optimal', $true, [Text.Encoding]::UTF8)
          $hash = (Get-FileHash "out/$zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/out/$zip.sha256", "$hash  $zip`n")
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            out/*.zip
            out/*.sha256
          if-no-files-found: error

  # The only job that may write, and it runs no build code: it creates the draft release from the build's files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ZIP: out/${{ needs.build.outputs.zip }}
        run: gh release create "$TAG" "$ZIP" "$ZIP.sha256" --draft --verify-tag --title "Streamer Toolkit $TAG"

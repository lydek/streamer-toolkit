# Same checks as docs/dev.md "每次提交前"; Windows only.
name: CI

# PRs only: with rebase-merge, main gets the same commits the PR run already checked.
# UI E2E runs in e2e.yml (manual and before a release), not here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Line numbers only, no full debug info: faster links and a smaller cache; panics still show file and line.
  # The `test` profile inherits `dev`. Keep it equal in cache.yml: rust-cache hashes CARGO* variables into its key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The main ruleset requires only `check`, which passes only when every job that had to run passed.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      rust: ${{ steps.changes.outputs.rust }}
      fakes_ui: ${{ steps.changes.outputs.fakes_ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base parent, to list the PR's files
      # The repo's Node version (package.json engines); the script needs no packages.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Here, not only in `web`'s script tests: a Rust-only PR skips those but may add a Rust read of a web path the
      # rules let skip `rust`.
      - name: Path rules match what the code reads
        run: node --test scripts/ci-changes.test.mjs
      # Which jobs the PR's files can affect; the rules and why each is safe are in the script. Docs-only PRs run just
      # the translation check in `web`.
      - name: Changed files
        id: changes
        run: node scripts/ci-changes.mjs

  # Frontend checks; runs on every PR for the translation check, the rest only when `web` is true. Needs no Rust: no
  # script or frontend test runs cargo (dev-server.test.ts and dev-fake.test.mjs only read Rust source as text).
  web:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ needs.changes.outputs.web == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.web == 'true'

      - name: Translations in sync
        run: node scripts/check-translations.mjs

      - name: Script tests
        if: needs.changes.outputs.web == 'true'
        run: pnpm test:scripts
      - name: Bundled frontend licenses (allowlist in docs/decisions.md)
        if: needs.changes.outputs.web == 'true'
        run: pnpm check:licenses

      - run: pnpm web:lint
        if: needs.changes.outputs.web == 'true'
      - run: pnpm web:test
        if: needs.changes.outputs.web == 'true'
      - name: Typecheck and build frontend
        if: needs.changes.outputs.web == 'true'
        run: pnpm web:build

  # In parallel with `web`. Builds the frontend bundles again, since the Host embeds them, but leaves the typecheck to
  # `web`. One command per step: Windows pwsh reports only the last native exit code.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Node for the frontend bundles and for openapi-typescript in the API contract check.
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      # Restores the cache cache.yml saves on main; PRs never save (1–1.7 GB each would evict main's).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo fmt --all --check

      # The Host embeds apps/web/dist at compile time; the tauri/custom-protocol clippy run embeds apps/web/dist-port
      # (frontendDist in apps/desktop/tauri.conf.json).
      - name: Build frontend (typecheck runs in web)
        run: pnpm --filter web exec vite build
      - name: Build frontend port page
        run: pnpm --filter web exec vite build --mode port

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy on release-only code (tauri/custom-protocol; checked, never shipped)
        run: cargo clippy --workspace --all-targets --features tauri/custom-protocol -- -D warnings
      - name: Tests (includes architecture tests)
        run: cargo test --workspace

      # Code-first contracts: regenerating must not change the checked-in OpenAPI and TS types. Runs the example
      # `cargo test --workspace` just built; `pnpm api:gen` (`cargo run -p host`) resolves only host's graph and would
      # compile a second set of crates.
      - name: Regenerate the OpenAPI document
        run: .\target\debug\examples\openapi.exe apps/web/src/api/openapi.json
      - name: Regenerate the TS types
        run: pnpm --filter web api:types
      - name: API contracts are up to date (run pnpm api:gen and commit)
        run: git diff --exit-code HEAD -- apps/web/src/api

      - name: Licenses and advisories
        run: cargo deny check

  # In parallel with `web` and `rust`, with its own cache (iced stays out of the `ci` one). Needs no Node: fakes
  # depends on neither the Host nor apps/web/dist.
  fakes-ui:
    needs: changes
    if: needs.changes.outputs.fakes_ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fakes-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One command per step: Windows pwsh reports only the last native exit code, so a failed clippy would pass.
      - name: Fake services control panel clippy (fakes `ui` feature; a dev tool, never shipped)
        run: cargo clippy -p fakes --all-targets --features ui -- -D warnings
      - name: Fake services control panel tests
        run: cargo test -p fakes --features ui --lib --bins

  # The one required check. A skipped required check counts as passing, so this runs always and accepts
  # `skipped` only where the PR's files allow it.
  check:
    needs: [changes, web, rust, fakes-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that had to run passed
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.web.result }}
          RUST: ${{ needs.rust.result }}
          FAKES_UI: ${{ needs.fakes-ui.result }}
          RUN_WEB: ${{ needs.changes.outputs.web }}
          RUN_RUST: ${{ needs.changes.outputs.rust }}
          RUN_FAKES_UI: ${{ needs.changes.outputs.fakes_ui }}
        run: |
          echo "changes=$CHANGES web=$WEB (run=$RUN_WEB) rust=$RUST (run=$RUN_RUST) fakes-ui=$FAKES_UI (run=$RUN_FAKES_UI)"
          [ "$CHANGES" = success ] && [ "$WEB" = success ] || exit 1
          # `web` always runs, but a missing flag would silently skip its frontend steps.
          [ "$RUN_WEB" = true ] || [ "$RUN_WEB" = false ] || exit 1
          # A job that had to run must pass; it may be skipped only when its flag is false.
          ok() { case "$2" in true) [ "$1" = success ] ;; false) [ "$1" = skipped ] ;; *) false ;; esac; }
          ok "$RUST" "$RUN_RUST" && ok "$FAKES_UI" "$RUN_FAKES_UI"

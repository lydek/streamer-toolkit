# Same checks as docs/dev.md "每次提交前"; Windows only.
name: CI

# PRs only: with rebase-merge, main gets the same commits the PR run already checked.
# UI E2E runs in e2e.yml (manual and before a release), not here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Line numbers only, no full debug info: faster links and a smaller cache; panics still show file and line.
  # The `test` profile inherits `dev`. Keep it equal in cache.yml: rust-cache hashes CARGO* variables into its key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The main ruleset requires only `check`, which passes only when every job that had to run passed.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base parent, to list the PR's files

      # Docs-only PRs run just the translation check. Docs = root *.md, docs/ (not decisions.md: it feeds the
      # frontend license allowlist), prototype/ and the agent folders .agents/ and .claude/, the files lefthook's
      # pre-push also skips for every check but translations. With rebase-merge main is never re-checked, so only
      # list files no check reads.
      - name: Changed files
        id: changes
        shell: bash
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          code=false
          [ -z "$files" ] && code=true
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              docs/decisions.md) code=true ;;
              docs/* | prototype/* | .agents/* | .claude/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  main:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ needs.changes.outputs.code == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code == 'true'

      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
        if: needs.changes.outputs.code == 'true'
      # Restores the cache cache.yml saves on main; PRs never save (1–1.7 GB each would evict main's).
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          tool: cargo-deny

      - name: Translations in sync
        run: node scripts/check-translations.mjs

      - name: Script tests
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:scripts
      - name: Bundled frontend licenses (allowlist in docs/decisions.md)
        if: needs.changes.outputs.code == 'true'
        run: pnpm check:licenses

      # Frontend first: the Host embeds apps/web/dist at compile time.
      - run: pnpm web:lint
        if: needs.changes.outputs.code == 'true'
      - run: pnpm web:test
        if: needs.changes.outputs.code == 'true'
      - name: Typecheck and build frontend
        if: needs.changes.outputs.code == 'true'
        run: pnpm web:build

      # Code-first contracts: regenerating must not change the checked-in OpenAPI and TS types.
      - name: Regenerate API contracts
        if: needs.changes.outputs.code == 'true'
        run: pnpm api:gen
      - name: API contracts are up to date (run pnpm api:gen and commit)
        if: needs.changes.outputs.code == 'true'
        run: git diff --exit-code HEAD -- apps/web/src/api

      - run: cargo fmt --all --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - name: Clippy on release-only code (tauri/custom-protocol; checked, never shipped)
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --features tauri/custom-protocol -- -D warnings
      - name: Tests (includes architecture tests)
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace
      - name: Licenses and advisories
        if: needs.changes.outputs.code == 'true'
        run: cargo deny check

  # In parallel with `main`, with its own cache (iced stays out of the main one). Needs no Node: fakes depends on
  # neither the Host nor apps/web/dist.
  fakes-ui:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fakes-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One command per step: Windows pwsh reports only the last native exit code, so a failed clippy would pass.
      - name: Fake services control panel clippy (fakes `ui` feature; a dev tool, never shipped)
        run: cargo clippy -p fakes --all-targets --features ui -- -D warnings
      - name: Fake services control panel tests
        run: cargo test -p fakes --features ui --lib --bins

  # The one required check. A skipped required check counts as passing, so this runs always and accepts
  # `skipped` only where the PR's files allow it.
  check:
    needs: [changes, main, fakes-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that had to run passed
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          MAIN: ${{ needs.main.result }}
          FAKES_UI: ${{ needs.fakes-ui.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES main=$MAIN fakes-ui=$FAKES_UI code=$CODE"
          [ "$CHANGES" = success ] && [ "$MAIN" = success ] || exit 1
          if [ "$CODE" = true ]; then [ "$FAKES_UI" = success ]
          elif [ "$CODE" = false ]; then [ "$FAKES_UI" = skipped ]
          else exit 1; fi

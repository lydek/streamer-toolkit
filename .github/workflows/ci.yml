# Same checks as docs/dev.md "每次提交前"; Windows only.
name: CI

# PRs only: with rebase-merge, main gets the same commits the PR run already checked.
# UI E2E runs in e2e.yml (manual and before a release), not here.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      # Restores the cache cache.yml saves on main; PRs never save (1–1.7 GB each would evict main's).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Translations in sync
        run: node scripts/check-translations.mjs

      - name: Script tests
        run: pnpm test:scripts
      - name: Bundled frontend licenses (allowlist in docs/decisions.md)
        run: pnpm check:licenses

      # Frontend first: the Host embeds apps/web/dist at compile time.
      - run: pnpm web:lint
      - run: pnpm web:test
      - name: Typecheck and build frontend
        run: pnpm web:build

      # Code-first contracts: regenerating must not change the checked-in OpenAPI and TS types.
      - name: Regenerate API contracts
        run: pnpm api:gen
      - name: API contracts are up to date (run pnpm api:gen and commit)
        run: git diff --exit-code HEAD -- apps/web/src/api

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy on release-only code (tauri/custom-protocol; checked, never shipped)
        run: cargo clippy --workspace --all-targets --features tauri/custom-protocol -- -D warnings
      - name: Tests (includes architecture tests)
        run: cargo test --workspace

      - name: Licenses and advisories
        run: cargo deny check

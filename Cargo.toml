[workspace]
resolver = "3"
members = ["crates/core", "crates/modules/chat", "crates/modules/alerts", "crates/modules/redemption", "crates/modules/checkin", "crates/modules/sound", "crates/modules/bgm",
    "crates/modules/counter", "crates/modules/bot", "crates/modules/overlays", "crates/modules/stream", "crates/modules/activity", "crates/modules/viewers", "crates/host", "crates/integrations", "crates/arch-tests", "crates/fakes", "apps/desktop"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Dev and test builds: line numbers for our crates (backtraces keep file and line), no debug info for dependencies.
# Smaller PDBs on Windows mean faster links, a smaller target/ and a smaller CI cache.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
